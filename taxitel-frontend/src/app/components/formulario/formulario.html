<div class="formulario-card">
  
<form [formGroup]="formularioViaje" (ngSubmit)="calcular()" class="tarjeta-formulario">
  <h3 class="titulo">Rutas Corporativas</h3>

  <div class="form-group">
    <label>Empresa a facturar</label>
    <input type="text" formControlName="empresa" placeholder="Ej. FLSMIDTH" list="listaEmpresas" autocomplete="off">
  </div>

  <!-- 1. El Inicio arriba -->
  <div class="form-group">
    <label>Punto de Inicio</label>
    <input type="text" formControlName="origen" placeholder="¿Dónde inicia el viaje?" list="listaRutas" autocomplete="off">
  </div>



  <!-- 3. La lista dinámica ultra limpia (Parada 1, Parada 2, Parada 3...) -->
  <div formArrayName="destinos">
    <div *ngFor="let dest of destinos.controls; let i=index" class="form-group parada-group">
      
      <!-- Etiqueta uniforme y sin resaltar, tal como lo pidió el cliente -->
      <label>Parada {{ i + 1 }}</label>
      
      <div class="input-con-boton">
        <input type="text" [formControlName]="i" placeholder="Ingrese la dirección" list="listaRutas" autocomplete="off">
        <button *ngIf="destinos.length > 1" type="button" class="btn-eliminar" (click)="eliminarDestino(i)" title="Eliminar parada">✕</button>
      </div>
    </div>
  </div>
  <!-- 2. El botón "+" inmediatamente debajo -->
  <button type="button" class="btn-secundario mt-2 mb-3" (click)="agregarDestino()">
    + Agregar Parada
  </button>
  <hr class="divisor">

  <div class="extras-grid">
    <div class="form-group">
      <label>Tiempo de Espera (Minutos)</label>
      <input type="number" formControlName="minutosEspera" min="0" placeholder="0">
    </div>
        
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="tieneMensajeria">
        ¿Lleva Mensajería? (+S/ 2.00)
      </label>
    </div>
  </div>

  <button type="submit" class="btn-primario" [disabled]="formularioViaje.invalid">
    Calcular Cotización
  </button>

  <!-- Datalists para autocompletado -->
  <datalist id="listaEmpresas">
    <option *ngFor="let emp of cotizacionService.empresasConocidas" [value]="emp"></option>
  </datalist>

  <datalist id="listaRutas">
    <option *ngFor="let ruta of cotizacionService.rutasConocidas" [value]="ruta"></option>
  </datalist>
</form>
</div>

<!-- Cerebro visual de sugerencias de autocompletado conectadas a tu Service -->
<datalist id="sugerenciasRutas">
  <option *ngFor="let ruta of cotizacionService.rutasConocidas" [value]="ruta"></option>
</datalist>
